<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PADDOCK SHOT v4</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@300;400;700&display=swap');
:root{--gold:#c9a84c;--gold2:#e8c96a;--dark:#0b0c10;--dark2:#13141a;--dark3:#1c1e28;--border:#2a2d3a;--green:#1db954;--red:#e53935;--blue:#2979ff;--orange:#ff6d00;--text:#d4d8e8;--muted:#5a5f78;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Noto Sans JP',sans-serif;background:var(--dark);color:var(--text);}
.tab-bar{display:flex;background:var(--dark2);border-bottom:1px solid var(--border);position:fixed;top:0;left:0;right:0;z-index:100;height:48px;}
.tab-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;font-size:.72rem;font-weight:700;color:var(--muted);cursor:pointer;border:none;background:none;font-family:'Noto Sans JP',sans-serif;border-bottom:3px solid transparent;transition:all .2s;}
.tab-btn.active{color:var(--gold2);border-bottom-color:var(--gold);}
.ti{font-size:.95rem;}
.badge{background:var(--orange);color:#fff;font-size:.55rem;padding:1px 5px;border-radius:10px;margin-left:2px;}
.mode-bar{display:flex;position:fixed;top:48px;left:0;right:0;z-index:99;height:36px;background:var(--dark3);border-bottom:1px solid var(--border);}
.mode-btn{flex:1;border:none;font-family:'Noto Sans JP',sans-serif;font-size:.75rem;font-weight:700;cursor:pointer;color:var(--muted);background:transparent;border-bottom:2px solid transparent;}
.mode-btn.race-active{color:var(--gold2);background:rgba(201,168,76,.12);border-bottom-color:var(--gold);}
.mode-btn.manual-active{color:var(--green);background:rgba(29,185,84,.1);border-bottom-color:var(--green);}
.page{display:none;position:fixed;top:108px;left:0;right:0;bottom:0;overflow:hidden;}
.page.active{display:flex;}
#pg-setup{flex-direction:column;overflow-y:auto;padding:12px 12px 100px;top:84px!important;}
.card{background:var(--dark2);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px;}
.card-lbl{font-size:.62rem;letter-spacing:.2em;color:var(--gold);text-transform:uppercase;margin-bottom:8px;}
.inp{width:100%;padding:9px 12px;background:var(--dark3);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.85rem;outline:none;font-family:'Noto Sans JP',sans-serif;margin-bottom:6px;}
.inp:focus{border-color:var(--gold);}
.inp::placeholder{color:var(--muted);}
.inp-row{display:flex;gap:8px;}
.inp-row .inp{margin-bottom:0;}
.preview{font-size:.72rem;color:var(--gold2);padding:5px 8px;background:rgba(201,168,76,.07);border-radius:6px;margin-top:4px;}
.filter-box{background:var(--dark3);border-radius:8px;padding:8px 10px;margin-bottom:8px;}
.filter-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px;}
.filter-inp{width:52px;padding:5px;background:var(--dark);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:.8rem;text-align:center;outline:none;}
.fq-btns{display:flex;gap:5px;flex-wrap:wrap;}
.fq-btn{padding:4px 8px;border:1px solid var(--border);border-radius:5px;background:var(--dark);color:var(--muted);font-size:.62rem;cursor:pointer;}
.race-item{display:flex;align-items:center;gap:8px;padding:9px 10px;background:var(--dark3);border:1px solid var(--border);border-radius:8px;cursor:pointer;margin-bottom:5px;}
.race-item.pnow{border-color:var(--green);background:rgba(29,185,84,.08);}
.race-item.psoon{border-color:var(--orange);background:rgba(255,109,0,.06);}
.race-item.psel{border-color:var(--gold)!important;background:rgba(201,168,76,.1)!important;}
.ri-time{font-size:.72rem;color:var(--muted);min-width:40px;}
.ri-venue{font-size:.82rem;font-weight:700;min-width:45px;}
.ri-race{font-size:.82rem;color:var(--gold2);min-width:32px;}
.ri-type{font-size:.58rem;color:var(--muted);}
.ri-badge{margin-left:auto;font-size:.6rem;padding:2px 7px;border-radius:10px;font-weight:700;white-space:nowrap;}
.bnow{background:var(--green);color:#fff;}
.bsoon{background:var(--orange);color:#fff;}
.head-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:6px;}
.head-btn{padding:9px 4px;border:1px solid var(--border);border-radius:8px;background:var(--dark3);color:var(--muted);font-size:.78rem;font-weight:700;cursor:pointer;}
.head-btn.active{border-color:var(--gold);background:rgba(201,168,76,.15);color:var(--gold2);}
.custom-row{display:flex;align-items:center;gap:8px;}
.custom-row label{font-size:.72rem;color:var(--muted);}
.inp-sm{width:65px;padding:7px;background:var(--dark3);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:.82rem;text-align:center;outline:none;}
.sel-info{display:none;padding:8px 12px;background:rgba(29,185,84,.1);border:1px solid var(--green);border-radius:8px;font-size:.78rem;color:var(--green);font-weight:700;margin-bottom:6px;text-align:center;}
.sel-info.show{display:block;}
.warn{font-size:.7rem;color:var(--orange);text-align:center;margin-bottom:4px;min-height:1.1em;}
.go-btn{width:100%;padding:14px;border:none;border-radius:10px;margin-top:4px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--dark);font-family:'Noto Sans JP',sans-serif;font-size:1rem;font-weight:700;cursor:pointer;}
.go-sub{width:100%;padding:11px;border:1px solid var(--green);border-radius:10px;margin-top:6px;background:rgba(29,185,84,.08);color:var(--green);font-family:'Noto Sans JP',sans-serif;font-size:.82rem;font-weight:700;cursor:pointer;}
#pg-shoot{flex-direction:row;}
.shoot-video{flex:1;position:relative;background:#000;overflow:hidden;}
video{width:100%;height:100%;object-fit:contain;display:block;}
.v-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:rgba(0,0,0,.8);color:var(--muted);font-size:.8rem;}
.v-overlay.hidden{display:none;}
#cropLayer{position:absolute;inset:0;cursor:crosshair;touch-action:none;}
#cropBox{position:absolute;display:none;border:2px solid var(--gold);background:rgba(201,168,76,.06);pointer-events:none;}
#cropBox.show{display:block;}
#dT,#dB,#dL,#dR{position:absolute;background:rgba(0,0,0,.45);pointer-events:none;display:none;}
.sidebar{width:88px;display:flex;flex-direction:column;align-items:center;background:var(--dark2);border-left:1px solid var(--border);overflow:hidden;}
.sb-top{display:flex;flex-direction:column;align-items:center;padding:6px 5px;gap:5px;width:100%;}
.src-btn{width:100%;padding:5px 2px;border:1px solid var(--border);border-radius:6px;background:var(--dark3);color:var(--muted);font-size:.56rem;font-weight:700;cursor:pointer;text-align:center;}
.src-btn.active{border-color:var(--gold);color:var(--gold2);}
.src-btn .si{display:block;font-size:.85rem;margin-bottom:1px;}
.shutter-btn{width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff,#ccc 60%,#999);border:3px solid #fff;box-shadow:0 0 0 3px rgba(255,255,255,.25);cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center;}
.shutter-btn:active{transform:scale(.86);}
.shutter-btn.flash{animation:fl .15s;}
@keyframes fl{0%{background:radial-gradient(circle,#fff,#fff);}100%{background:radial-gradient(circle at 40% 35%,#fff,#ccc 60%,#999);}}
.shot-lbl{font-size:.56rem;color:var(--muted);}
.crop-rst{font-size:.52rem;color:var(--muted);background:var(--dark3);border:1px solid var(--border);border-radius:4px;padding:2px 5px;cursor:pointer;}
.crop-rst.active{color:var(--gold2);border-color:var(--gold);}
.sb-count{font-size:.58rem;color:var(--muted);padding:3px 0;text-align:center;width:100%;}
.sb-thumbs{flex:1;overflow-y:auto;width:100%;padding:3px 5px 60px;display:flex;flex-direction:column;gap:3px;}
.sb-thumb{position:relative;width:100%;aspect-ratio:16/9;border-radius:4px;overflow:hidden;border:1px solid var(--border);flex-shrink:0;}
.sb-thumb img{width:100%;height:100%;object-fit:cover;object-position:center center;display:block;}
.sb-seq{position:absolute;bottom:1px;right:2px;font-size:.48rem;color:rgba(255,255,255,.7);font-weight:700;}
#pg-assign{flex-direction:column;overflow:hidden;}
.ua-area{padding:7px 10px 5px;border-bottom:2px solid var(--border);background:var(--dark2);flex-shrink:0;}
.area-lbl{font-size:.6rem;letter-spacing:.15em;color:var(--gold);text-transform:uppercase;margin-bottom:5px;}
.u-scroll{display:flex;gap:5px;overflow-x:auto;padding-bottom:3px;}
.u-thumb{position:relative;flex-shrink:0;width:110px;aspect-ratio:16/9;border-radius:6px;overflow:hidden;border:2px solid var(--border);cursor:pointer;}
.u-thumb.sel{border-color:var(--orange);box-shadow:0 0 0 2px rgba(255,109,0,.4);}
.u-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.u-seq{position:absolute;bottom:2px;right:3px;font-size:.48rem;color:rgba(255,255,255,.7);font-weight:700;}
.u-mark{position:absolute;inset:0;background:rgba(255,109,0,.25);display:none;align-items:center;justify-content:center;font-size:1.1rem;}
.u-thumb.sel .u-mark{display:flex;}
.u-empty{color:var(--muted);font-size:.72rem;padding:10px 4px;white-space:nowrap;}
.sel-banner{display:none;padding:5px 12px;background:rgba(255,109,0,.1);border-bottom:1px solid rgba(255,109,0,.3);font-size:.7rem;color:var(--orange);align-items:center;justify-content:space-between;flex-shrink:0;position:relative;z-index:1;}
.sel-banner.show{display:flex;}
.cancel-sel{font-size:.65rem;color:var(--muted);cursor:pointer;padding:2px 7px;border:1px solid var(--border);border-radius:4px;background:var(--dark3);}
.horse-area{flex:1;overflow-y:auto;padding:5px 8px 80px;}
.horse-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;}
.horse-box{background:var(--dark2);border:1px solid var(--border);border-radius:9px;overflow:hidden;}
.horse-box.has-photos{border-color:var(--blue);}
.hbox-head{display:flex;align-items:center;gap:5px;padding:4px 8px;border-bottom:1px solid var(--border);background:var(--dark3);}
.hbox-num{font-family:'Bebas Neue',sans-serif;font-size:.95rem;color:var(--gold2);min-width:28px;}
.hbox-cnt{font-size:.58rem;color:var(--muted);}
.hbox-clr{margin-left:auto;font-size:.58rem;color:var(--muted);cursor:pointer;padding:1px 5px;border:1px solid var(--border);border-radius:3px;}
.hbox-photos{display:flex;gap:3px;padding:5px;min-height:48px;flex-wrap:wrap;}
.hbox-empty{font-size:.6rem;color:var(--muted);padding:8px 4px;align-self:center;}
.box-photo{position:relative;width:68px;aspect-ratio:16/9;border-radius:4px;overflow:hidden;border:1px solid var(--border);flex-shrink:0;}
.box-photo img{width:100%;height:100%;object-fit:cover;object-position:center center;display:block;}
.box-del{position:absolute;top:1px;right:1px;width:14px;height:14px;border-radius:50%;background:rgba(229,57,53,.9);border:none;color:#fff;font-size:.5rem;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.dl-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(11,12,16,.95);border-top:1px solid var(--border);padding:8px 12px;display:none;align-items:center;gap:8px;z-index:101;}
.dl-bar.show{display:flex;}
#dlBtn{flex:1;padding:12px;border:none;border-radius:9px;background:linear-gradient(135deg,#1a6b35,var(--green));color:#fff;font-family:'Noto Sans JP',sans-serif;font-size:.85rem;font-weight:700;cursor:pointer;}
#dlBtn:disabled{opacity:.35;cursor:not-allowed;}
#clrBtn{padding:12px 13px;border:1px solid var(--border);border-radius:9px;background:var(--dark3);color:var(--muted);font-family:'Noto Sans JP',sans-serif;font-size:.78rem;font-weight:700;cursor:pointer;white-space:nowrap;}
#zipOv{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:200;align-items:center;justify-content:center;flex-direction:column;gap:12px;}
#zipOv.show{display:flex;}
#zipMsg{color:var(--gold2);font-size:.9rem;font-weight:700;}
#zipSub{color:var(--muted);font-size:.72rem;}
canvas{display:none;}
</style>
</head>
<body>
<div class="tab-bar">
  <button class="tab-btn active" id="tab-setup" onclick="goTab('setup')"><span class="ti">⚙️</span>設定</button>
  <button class="tab-btn" id="tab-shoot" onclick="goTab('shoot')"><span class="ti">📷</span>撮影<span class="badge" id="badge-shoot" style="display:none">0</span></button>
  <button class="tab-btn" id="tab-assign" onclick="goTab('assign')"><span class="ti">🔢</span>振り分け<span class="badge" id="badge-unassigned" style="display:none">0</span></button>
</div>
<!-- モード・レース名サブバー -->
<div id="sub-bar" style="position:fixed;top:84px;left:0;right:0;z-index:98;
  background:rgba(11,12,16,.95);border-bottom:1px solid var(--border);
  padding:0 12px;font-size:.68rem;color:var(--muted);
  align-items:center;gap:6px;height:24px;display:none;">
  <span id="sub-mode-icon"></span>
  <span id="sub-mode-label"></span>
  <span id="sub-race-label" style="font-weight:700;"></span>
</div>
<div class="mode-bar">
  <button class="mode-btn race-active" id="mb-race" onclick="setMode('race')">🏇 パドックモード</button>
  <button class="mode-btn" id="mb-manual" onclick="setMode('manual')">✏️ 手動モード</button>
</div>

<div class="page active" id="pg-setup">
  <!-- ユーザー認証カード -->
  <div class="card" id="userCard">
    <div class="card-lbl">👤 ユーザー設定</div>
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
      <input class="inp" id="userName" type="text" placeholder="名前を入力（例: タロウ）" style="margin-bottom:0;flex:1;">
      <button onclick="verifyUser()" style="padding:9px 14px;border:1px solid var(--gold);border-radius:8px;background:rgba(201,168,76,.12);color:var(--gold2);font-size:.78rem;font-weight:700;cursor:pointer;white-space:nowrap;">認証</button>
    </div>
    <div id="userStatus" style="font-size:.7rem;color:var(--muted);min-height:1.2em;padding:4px 0;"></div>
  </div>
  <div id="sec-race">
    <div class="card">
      <div class="card-lbl">📊 スプレッドシート読込</div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
        <span style="font-size:.72rem;color:var(--muted);">競馬スケジュールを自動取得</span>
        <button onclick="loadSchedule()" style="padding:6px 12px;border:1px solid var(--gold);border-radius:6px;background:rgba(201,168,76,.1);color:var(--gold2);font-size:.72rem;font-weight:700;cursor:pointer;">🔄 再読込</button>
      </div>
      <div id="sheetStatus" style="font-size:.7rem;color:var(--muted);">読込中...</div>
    </div>
    <div id="raceCard" style="display:none;" class="card">
      <div class="card-lbl" style="display:flex;justify-content:space-between;align-items:center;"><span>🏇 レース一覧</span><span id="clockDisp" style="color:var(--text);font-size:.7rem;letter-spacing:0;text-transform:none;font-weight:700;"></span></div>
      <div class="filter-box">
        <div style="font-size:.62rem;color:var(--gold);margin-bottom:6px;">⏱️ 表示フィルター（発走まで）</div>
        <div class="filter-row">
          <span style="font-size:.7rem;color:var(--muted);">最大</span>
          <input type="number" class="filter-inp" id="fBefore" value="60" min="10" max="999" step="5" oninput="renderRaceList()">
          <span style="font-size:.7rem;color:var(--muted);">分前〜最小</span>
          <input type="number" class="filter-inp" id="fAfter" value="10" min="0" max="60" step="5" oninput="renderRaceList()">
          <span style="font-size:.7rem;color:var(--muted);">分前</span>
        </div>
        <div class="fq-btns">
          <button class="fq-btn" onclick="setFilter(60,10)">60〜10分前</button>
          <button class="fq-btn" onclick="setFilter(45,10)">45〜10分前</button>
          <button class="fq-btn" onclick="setFilter(30,10)">30〜10分前</button>
          <button class="fq-btn" onclick="setFilter(999,0)">全て表示</button>
        </div>
        <div id="filterDesc" style="font-size:.63rem;color:var(--muted);margin-top:4px;"></div>
      </div>
      <div style="font-size:.65rem;color:var(--muted);margin-bottom:5px;"><span style="color:var(--green);">●</span> パドック中（30〜10分前）　<span style="color:var(--orange);">●</span> もうすぐ（60〜30分前）</div>
      <div id="raceCount" style="font-size:.68rem;color:var(--gold2);margin-bottom:5px;"></div>
      <div id="raceList"></div>
    </div>
  </div>
  <div id="sec-manual" style="display:none;">
    <div class="card">
      <div class="card-lbl">✏️ レース・撮影情報</div>
      <div class="inp-row" style="margin-bottom:6px;">
        <input class="inp" id="mDate" type="date" style="max-width:145px;margin-bottom:0;">
        <input class="inp" id="mVenue" type="text" placeholder="競馬場・場所（例: 金沢）" style="margin-bottom:0;">
      </div>
      <div style="font-size:.62rem;color:var(--gold);letter-spacing:.12em;margin-bottom:5px;">🏁 レース番号</div>
      <div id="raceNumGrid" style="display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-bottom:6px;"></div>
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
        <span style="font-size:.7rem;color:var(--muted);white-space:nowrap;">直接入力:</span>
        <input class="inp" id="mRace" type="text" placeholder="例: 調教20260425" style="margin-bottom:0;font-size:.82rem;">
      </div>
      <div class="preview" id="manualPreview">📋 上記を入力するとZIP名が決まります</div>
    </div>
  </div>
  <div class="card">
    <div class="card-lbl">🐎 頭数設定</div>
    <div class="head-grid">
      <button class="head-btn" onclick="setMax(8)">8頭</button>
      <button class="head-btn" onclick="setMax(12)">12頭</button>
      <button class="head-btn active" onclick="setMax(16)">16頭</button>
      <button class="head-btn" onclick="setMax(18)">18頭</button>
    </div>
    <div class="custom-row"><label>直接入力:</label><input class="inp-sm" id="customMax" type="number" min="1" max="18" placeholder="例:14"></div>
  </div>
  <div class="sel-info" id="selInfo"></div>
  <div class="warn" id="warnMsg"></div>
  <button class="go-btn" onclick="goShoot()">📷 撮影をはじめる →</button>
  <button class="go-sub" onclick="goShootManual()">✏️ 手動モードで今すぐ撮影する</button>
</div>

<div class="page" id="pg-shoot">
  <div class="shoot-video">
    <video id="liveVideo" autoplay muted playsinline></video>
    <div class="v-overlay" id="vOverlay"><span style="font-size:1.8rem;">📷</span><span>右のボタンで映像を起動</span></div>
    <div id="dT"></div><div id="dB"></div><div id="dL"></div><div id="dR"></div>
    <div id="cropBox"></div><div id="cropLayer"></div>
  </div>
  <div class="sidebar">
    <div class="sb-top">
      <button class="src-btn" id="btnRear" onclick="startCam('environment')"><span class="si">📷</span>リア</button>
      <button class="src-btn" id="btnFront" onclick="startCam('user')"><span class="si">🤳</span>フロント</button>
      <button class="src-btn" id="btnScreen" onclick="startScreen()"><span class="si">🖥️</span>画面</button>
      <label class="src-btn" for="fileInput" style="border-color:var(--green);color:var(--green);display:block;text-align:center;"><span class="si">📁</span>追加</label>
      <input type="file" id="fileInput" accept="image/*" multiple style="display:none;">
      <button class="shutter-btn" onclick="shoot()">📸</button>
      <div class="shot-lbl" id="shotLbl">0枚</div>
      <button class="crop-rst" id="cropRst" onclick="resetCrop()">範囲:全体</button>
    </div>
    <div class="sb-count" id="sbCount"></div>
    <div class="sb-thumbs" id="sbThumbs"></div>
  </div>
</div>

<div class="page" id="pg-assign">
  <div class="ua-area">
    <div class="area-lbl">📷 未割当の写真（タップで選択→馬番ボックスをタップで割当）</div>
    <div class="u-scroll" id="uScroll"><span class="u-empty">未割当の写真はありません</span></div>
  </div>
  <div class="sel-banner" id="selBanner">
  <span><b id="selCount">0</b>枚選択中</span>
  <div style="display:flex;gap:6px;align-items:center;">
    <button onclick="deleteSelected()" style="padding:4px 10px;border:1px solid var(--red);border-radius:5px;background:rgba(229,57,53,.15);color:var(--red);font-size:.68rem;font-weight:700;cursor:pointer;">🗑️ 選択削除</button>
    <span class="cancel-sel" onclick="clearSel()">✕ キャンセル</span>
  </div>
</div>

<script>
// ━━━ 状態 ━━━
let shots=[], nextId=1, maxHorse=16, mediaStream=null;
let crop={x:0,y:0,w:1,h:1,active:false};
let selectedIds=new Set(), currentMode='race', selectedRace=null, allRaces=[];
const GAS_URL='https://script.google.com/macros/s/AKfycbx1tHu_tve6A5UjGDtEHK5mnDkFxusjXIVyF2QcQZRQjJq5vm2l7xQr1HU0NnsIRHOy/exec';

// ━━━ タブ ━━━
function goTab(name) {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('pg-'+name).classList.add('active');
  document.getElementById('tab-'+name).classList.add('active');
  if(name==='assign'){document.getElementById('dlBar').classList.add('show');renderUnassigned();renderHorseGrid();updateDlBtn();}
  else document.getElementById('dlBar').classList.remove('show');
  updateSubBar(name);
}

function updateSubBar(name) {
  const bar   = document.getElementById('sub-bar');
  const icon  = document.getElementById('sub-mode-icon');
  const label = document.getElementById('sub-mode-label');
  const race  = document.getElementById('sub-race-label');
  if(!bar||!icon||!label||!race) return;

  if(name === 'setup') {
    bar.style.display = 'none';
    // setupページのtopを戻す
    const pg = document.getElementById('pg-setup');
    if(pg) pg.style.top = '84px';
    return;
  }

  // shoot/assignページではサブバーを表示
  bar.style.display = 'flex';
  // そのページのtopをサブバー分下げる
  const pg = document.getElementById('pg-'+name);
  if(pg) pg.style.top = '108px';

  if(currentMode === 'race') {
    icon.textContent  = '🏇';
    label.textContent = 'パドックモード';
    label.style.color = 'var(--gold2)';
    if(selectedRace) {
      race.textContent = ' ｜ '+selectedRace.venue+' '+selectedRace.race+'（'+selectedRace.time+'発走）';
      race.style.color = 'var(--green)';
    } else {
      race.textContent = ' ｜ レース未選択';
      race.style.color = 'var(--orange)';
    }
  } else {
    icon.textContent  = '✏️';
    label.textContent = '手動モード';
    label.style.color = 'var(--green)';
    const rid = getManualId();
    race.textContent  = rid !== 'manual' ? ' ｜ '+rid : '';
    race.style.color  = 'var(--gold2)';
  }
}

// ━━━ モード ━━━
function setMode(mode) {
  currentMode=mode;
  const br=document.getElementById('mb-race'), bm=document.getElementById('mb-manual');
  const sr=document.getElementById('sec-race'), sm=document.getElementById('sec-manual');
  if(mode==='race'){
    br.className='mode-btn race-active'; bm.className='mode-btn';
    sr.style.display='block'; sm.style.display='none';
  } else {
    bm.className='mode-btn manual-active'; br.className='mode-btn';
    sm.style.display='block'; sr.style.display='none';
  }
  updateGoBtn();
  // 現在のタブのサブバーも更新
  const activeTab = document.querySelector('.tab-btn.active');
  if(activeTab) updateSubBar(activeTab.id.replace('tab-',''));
}

// ━━━ 撮影移動 ━━━
function goShoot() {
  if(currentMode==='race'&&!selectedRace){
    document.getElementById('warnMsg').textContent='⚠️ レースを選択してください（または手動モードボタンをタップ）';
    return;
  }
  document.getElementById('warnMsg').textContent='';
  goTab('shoot');
}
function goShootManual(){setMode('manual');goTab('shoot');}

function updateGoBtn() {
  const info=document.getElementById('selInfo'), warn=document.getElementById('warnMsg');
  if(currentMode==='manual'){
    info.classList.add('show'); info.style.borderColor='var(--gold)';
    info.textContent='✏️ 手動モード: 自由に撮影できます'; warn.textContent='';
  } else {
    if(selectedRace){
      info.classList.add('show'); info.style.borderColor='var(--green)';
      info.textContent='🏇 '+selectedRace.venue+' '+selectedRace.race+'（'+selectedRace.time+'発走）';
      warn.textContent='';
    } else {info.classList.remove('show');}
  }
}

// ━━━ スプレッドシート ━━━
async function loadSchedule() {
  const st=document.getElementById('sheetStatus');
  st.textContent='📥 読込中...'; st.style.color='var(--muted)';
  try {
    const res=await fetch(GAS_URL);
    if(!res.ok) throw new Error('HTTP '+res.status);
    parseSchedule(await res.json());
  } catch(e){st.textContent='❌ 読込失敗: '+e.message; st.style.color='var(--red)';}
}

function parseSchedule(rows) {
  const st=document.getElementById('sheetStatus');
  const dm=String(rows[0]?.[0]||'').match(/(\d{4}[\/\.\-]\d{1,2}[\/\.\-]\d{1,2})/);
  const sd=dm?dm[1].replace(/[\/\.]/g,'-'):new Date().toISOString().slice(0,10);
  const today=new Date().toISOString().slice(0,10);
  if(sd&&sd!==today){
    st.textContent='⚠️ スプレッドシートの日付('+sd+')と今日('+today+')が異なります。更新されていない可能性があります。';
    st.style.color='var(--orange)'; document.getElementById('raceCard').style.display='none'; return;
  }
  allRaces=[];
  for(let i=1;i<rows.length;i++){
    const r=rows[i],c0=String(r[0]||'').trim(),c1=String(r[1]||'').trim(),c2=String(r[2]||'').trim(),c3=String(r[3]||'').trim();
    if(!c0||!c1||!c2||c0.includes('競馬場')||c0.startsWith('【')) continue;
    if(!c2.match(/^\d{1,2}:\d{2}$/)) continue;
    allRaces.push({date:sd,venue:c0,race:c1,time:c2.length===4?'0'+c2:c2,type:c3});
  }
  st.textContent='✅ '+sd+' / '+allRaces.length+'レース読込完了'; st.style.color='var(--green)';
  document.getElementById('raceCard').style.display='block';
  renderRaceList(); startClock();
}

function startClock(){updateClock();setInterval(()=>{updateClock();renderRaceList();},30000);}
function updateClock(){const now=new Date(),el=document.getElementById('clockDisp');if(el)el.textContent='現在 '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');}
function setFilter(b,a){document.getElementById('fBefore').value=b;document.getElementById('fAfter').value=a;renderRaceList();}

function renderRaceList() {
  const list=document.getElementById('raceList'),count=document.getElementById('raceCount'),desc=document.getElementById('filterDesc');
  const now=new Date(),before=parseInt(document.getElementById('fBefore')?.value)||60,after=parseInt(document.getElementById('fAfter')?.value)||10;
  list.innerHTML='';
  const filtered=allRaces.filter(r=>{const[rh,rm]=r.time.split(':').map(Number),rt=new Date();rt.setHours(rh,rm,0,0);const d=(rt-now)/60000;return before>=999?(d>=after):(d>=after&&d<=before);});
  if(desc) desc.textContent=before>=999?'全レース表示中':'発走'+before+'分前〜'+after+'分前のレースを表示中';
  if(count) count.textContent=filtered.length>0?filtered.length+'レース表示中':'';
  if(filtered.length===0){list.innerHTML='<div style="color:var(--muted);font-size:.78rem;padding:14px;text-align:center;">該当するレースがありません<br><small>フィルターを調整してください</small></div>';return;}
  filtered.sort((a,b)=>a.time.localeCompare(b.time)).forEach(r=>{
    const[rh,rm]=r.time.split(':').map(Number),rt=new Date();rt.setHours(rh,rm,0,0);
    const diff=Math.round((rt-now)/60000);
    const isSel=selectedRace&&selectedRace.venue===r.venue&&selectedRace.race===r.race;
    let cls='race-item',badge='';
    if(diff>=10&&diff<=30){cls+=' pnow';badge='<span class="ri-badge bnow">🟢 '+diff+'分前</span>';}
    else if(diff>30){cls+=' psoon';badge='<span class="ri-badge bsoon">🟡 '+diff+'分前</span>';}
    if(isSel) cls+=' psel';
    const div=document.createElement('div');div.className=cls;
    div.innerHTML='<span class="ri-time">'+r.time+'</span><span class="ri-venue">'+r.venue+'</span><span class="ri-race">'+r.race+'</span><span class="ri-type">'+r.type+'</span>'+badge+(isSel?'<span style="margin-left:4px;">✅</span>':'');
    div.addEventListener('click',()=>{selectedRace=isSel?null:r;renderRaceList();updateGoBtn();});
    list.appendChild(div);
  });
}

// ━━━ 手動モード ━━━
let selectedRaceNum = '';

function buildRaceNumGrid(){
  const grid = document.getElementById('raceNumGrid');
  if(!grid) return;
  grid.innerHTML = '';
  for(let i=1;i<=12;i++){
    const btn = document.createElement('button');
    btn.textContent = i+'R';
    btn.style.cssText='padding:8px 2px;border:1px solid var(--border);border-radius:6px;background:var(--dark3);color:var(--muted);font-size:.78rem;font-weight:700;cursor:pointer;font-family:"Noto Sans JP",sans-serif;';
    if(selectedRaceNum===i+'R'){btn.style.borderColor='var(--gold)';btn.style.background='rgba(201,168,76,.18)';btn.style.color='var(--gold2)';}
    btn.addEventListener('click',()=>{
      if(selectedRaceNum===i+'R'){selectedRaceNum='';document.getElementById('mRace').value='';}
      else{selectedRaceNum=i+'R';document.getElementById('mRace').value='';}
      buildRaceNumGrid();updateManualPreview();
    });
    grid.appendChild(btn);
  }
}

function getManualId(){
  const d=(document.getElementById('mDate')?.value||'').replace(/-/g,'');
  const v=(document.getElementById('mVenue')?.value||'').trim();
  const rBtn=selectedRaceNum;
  const rFree=(document.getElementById('mRace')?.value||'').trim();
  const r=rBtn||rFree;
  return[d,v,r].filter(Boolean).join('_')||'manual';
}

function updateManualPreview(){
  const p=document.getElementById('manualPreview');
  const id=getManualId();
  if(p) p.textContent = id!=='manual' ? '📋 ZIP名: '+id+'.zip' : '📋 上記を入力するとZIP名が決まります';
  // サブバーも更新
  const activeTab=document.querySelector('.tab-btn.active');
  if(activeTab) updateSubBar(activeTab.id.replace('tab-',''));
}

['mDate','mVenue','mRace'].forEach(id=>{
  const el=document.getElementById(id);
  if(el) el.addEventListener('input',()=>{
    if(id==='mRace'&&el.value.trim()){selectedRaceNum='';buildRaceNumGrid();}
    updateManualPreview();
  });
});

// ━━━ ZIP名 ━━━
function getRaceId(){if(currentMode==='race'&&selectedRace)return selectedRace.date.replace(/-/g,'')+'_'+selectedRace.venue+'_'+selectedRace.race;return getManualId();}

// ━━━ 頭数 ━━━
function setMax(n){if(!n||n<1||n>18)return;maxHorse=n;document.querySelectorAll('.head-btn').forEach(b=>b.classList.remove('active'));const m={8:0,12:1,16:2,18:3};if(m[n]!==undefined)document.querySelectorAll('.head-btn')[m[n]].classList.add('active');renderHorseGrid();}
document.getElementById('customMax').addEventListener('input',function(){const v=parseInt(this.value);if(v>=1&&v<=18)setMax(v);});

// ━━━ カメラ ━━━
async function startCam(facing){try{if(mediaStream)mediaStream.getTracks().forEach(t=>t.stop());const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing==='environment'?{ideal:'environment'}:'user'},audio:false});setStream(stream,facing==='user'?'btnFront':'btnRear');}catch(e){alert('カメラエラー: '+e.message);}}
async function startScreen(){try{if(mediaStream)mediaStream.getTracks().forEach(t=>t.stop());setStream(await navigator.mediaDevices.getDisplayMedia({video:true}),'btnScreen');}catch(e){alert('画面キャプチャエラー: '+e.message);}}
function setStream(stream,btnId){mediaStream=stream;const v=document.getElementById('liveVideo');v.srcObject=stream;v.onloadedmetadata=()=>document.getElementById('vOverlay').classList.add('hidden');document.querySelectorAll('.src-btn').forEach(b=>b.classList.remove('active'));document.getElementById(btnId).classList.add('active');}

// ━━━ 範囲選択 ━━━
{const layer=document.getElementById('cropLayer'),box=document.getElementById('cropBox');let drag=false,sx=0,sy=0;
const pos=e=>{const r=layer.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top};};
const onS=e=>{if(e.touches&&e.touches.length>1)return;e.preventDefault();drag=true;const p=pos(e);sx=p.x;sy=p.y;Object.assign(box.style,{left:sx+'px',top:sy+'px',width:'0',height:'0'});box.classList.add('show');};
const onM=e=>{if(!drag)return;e.preventDefault();const p=pos(e),l=Math.min(sx,p.x),t=Math.min(sy,p.y),w=Math.abs(p.x-sx),h=Math.abs(p.y-sy);Object.assign(box.style,{left:l+'px',top:t+'px',width:w+'px',height:h+'px'});};
const onE=e=>{if(!drag)return;drag=false;const ow=layer.offsetWidth,oh=layer.offsetHeight,l=parseFloat(box.style.left),t=parseFloat(box.style.top),w=parseFloat(box.style.width),h=parseFloat(box.style.height);if(w>ow*.04&&h>oh*.04){crop={x:l/ow,y:t/oh,w:w/ow,h:h/oh,active:true};showDims(l,t,w,h,ow,oh);const rst=document.getElementById('cropRst');rst.textContent='範囲:'+Math.round(w/ow*100)+'%×'+Math.round(h/oh*100)+'%';rst.classList.add('active');}else resetCrop();};
layer.addEventListener('mousedown',onS);layer.addEventListener('mousemove',onM);layer.addEventListener('mouseup',onE);
layer.addEventListener('touchstart',onS,{passive:false});layer.addEventListener('touchmove',onM,{passive:false});layer.addEventListener('touchend',onE);}
function showDims(l,t,w,h,ow,oh){['dT','dB','dL','dR'].forEach(id=>document.getElementById(id).style.display='block');const s=(id,st)=>Object.assign(document.getElementById(id).style,st);s('dT',{left:'0',top:'0',width:ow+'px',height:t+'px'});s('dB',{left:'0',top:(t+h)+'px',width:ow+'px',height:(oh-t-h)+'px'});s('dL',{left:'0',top:t+'px',width:l+'px',height:h+'px'});s('dR',{left:(l+w)+'px',top:t+'px',width:(ow-l-w)+'px',height:h+'px'});}
function resetCrop(){crop={x:0,y:0,w:1,h:1,active:false};document.getElementById('cropBox').classList.remove('show');['dT','dB','dL','dR'].forEach(id=>document.getElementById(id).style.display='none');const rst=document.getElementById('cropRst');rst.textContent='範囲:全体';rst.classList.remove('active');}

// ━━━ シャッター ━━━
function shoot(){const v=document.getElementById('liveVideo');if(!v.videoWidth){alert('映像を起動してください');return;}const vw=v.videoWidth,vh=v.videoHeight,sx=Math.round(crop.x*vw),sy=Math.round(crop.y*vh),sw=Math.round(crop.w*vw),sh=Math.round(crop.h*vh);const snap=document.getElementById('snapCanvas');snap.width=vw;snap.height=vh;snap.getContext('2d').drawImage(v,0,0);const out=document.getElementById('cropCanvas');out.width=sw;out.height=sh;out.getContext('2d').drawImage(snap,sx,sy,sw,sh,0,0,sw,sh);shots.push({id:nextId++,dataURL:out.toDataURL('image/jpeg',.92),horseNum:null});document.querySelector('.shutter-btn')?.classList.add('flash');setTimeout(()=>document.querySelector('.shutter-btn')?.classList.remove('flash'),200);renderSbThumbs();updateBadges();}

// ファイルアップロード
document.getElementById('fileInput').addEventListener('change',function(e){const files=Array.from(e.target.files).filter(f=>f.type.startsWith('image/'));let loaded=0;files.forEach(file=>{const reader=new FileReader();reader.onload=ev=>{const img=new Image();img.onload=()=>{const MAX=1280,w=img.width>MAX?MAX:img.width,h=img.width>MAX?Math.round(img.height*MAX/img.width):img.height;const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);shots.push({id:nextId++,dataURL:c.toDataURL('image/jpeg',.88),horseNum:null});if(++loaded===files.length){renderSbThumbs();updateBadges();}};img.src=ev.target.result;};reader.readAsDataURL(file);});this.value='';});

function renderSbThumbs(){const wrap=document.getElementById('sbThumbs'),n=shots.length;document.getElementById('shotLbl').textContent=n+'枚';document.getElementById('sbCount').textContent=n===0?'未撮影':n+'枚';wrap.innerHTML='';[...shots].reverse().forEach((s,i)=>{const d=document.createElement('div');d.className='sb-thumb';d.innerHTML='<img src="'+s.dataURL+'"><div class="sb-seq">'+(shots.length-i)+'</div>';wrap.appendChild(d);});}

// ━━━ ユーザー認証 ━━━
// GASのURLは後で設定（ZIPアップロード受付用）
const GAS_UPLOAD_URL = '/.netlify/functions/proxy';

let verifiedUser = '';

function initUser() {
  const saved = localStorage.getItem('paddock_user');
  if (saved) {
    document.getElementById('userName').value = saved;
    verifiedUser = saved;
    setUserStatus('✅ ' + saved + ' としてログイン中', 'var(--green)');
    updateUploadBtn();
  }
}

async function verifyUser() {
  const name = document.getElementById('userName').value.trim();
  if (!name) { setUserStatus('⚠️ 名前を入力してください', 'var(--orange)'); return; }
  setUserStatus('🔄 確認中...', 'var(--muted)');

  // GAS_UPLOAD_URLが未設定の場合はローカル保存のみ
  if (!GAS_UPLOAD_URL) {
    verifiedUser = name;
    localStorage.setItem('paddock_user', name);
    setUserStatus('✅ ' + name + ' として設定しました（認証サーバー未設定）', 'var(--green)');
    updateUploadBtn();
    return;
  }

  try {
    const data = await xhrGet(GAS_UPLOAD_URL + '?action=verify&name=' + encodeURIComponent(name));
    if (data.ok) {
      verifiedUser = name;
      localStorage.setItem('paddock_user', name);
      setUserStatus('✅ ' + name + ' として認証済み', 'var(--green)');
    } else {
      verifiedUser = '';
      localStorage.removeItem('paddock_user');
      setUserStatus('❌ 登録されていません（管理者に確認してください）', 'var(--red)');
    }
    updateUploadBtn();
  } catch(e) {
    setUserStatus('❌ 認証エラー: ' + e.message, 'var(--red)');
  }
}

function setUserStatus(msg, color) {
  const el = document.getElementById('userStatus');
  if (el) { el.textContent = msg; el.style.color = color; }
}

function updateUploadBtn() {
  const btn = document.getElementById('uploadBtn');
  if (!btn) return;
  const assigned = shots.filter(s => s.horseNum).length;
  if (verifiedUser && assigned > 0) {
    btn.disabled = false;
    btn.style.opacity = '1';
  } else {
    btn.disabled = true;
    btn.style.opacity = verifiedUser ? '0.4' : '0.25';
  }
}

// ━━━ Drive送信 ━━━
async function uploadToDrive() {
  const assigned = shots.filter(s => s.horseNum);
  if (assigned.length === 0) return;
  if (!verifiedUser) { alert('先にユーザー認証をしてください'); return; }

  const ov = document.getElementById('uploadOv');
  const msg = document.getElementById('uploadMsg');
  const sub = document.getElementById('uploadSub');
  const icon = document.getElementById('uploadOvIcon');
  const closeBtn = document.getElementById('uploadOvClose');

  ov.style.display = 'flex';
  icon.textContent = '📦';
  msg.textContent = 'ZIP作成中...';
  sub.textContent = '';
  closeBtn.style.display = 'none';

  try {
    // ZIP作成
    const raceId = getRaceId();
    const zip = new JSZip();
    const folder = zip.folder(raceId);
    const cnts = {};
    assigned.forEach(s => {
      const n = s.horseNum;
      cnts[n] = (cnts[n] || 0) + 1;
      folder.file('horse_' + String(n).padStart(2,'0') + '_' + cnts[n] + '.jpg',
        s.dataURL.split(',')[1], {base64: true});
    });
    const blob = await zip.generateAsync({type:'blob'}, m => {
      sub.textContent = '圧縮中: ' + Math.round(m.percent) + '%';
    });

    // Base64変換
    icon.textContent = '📤';
    msg.textContent = 'Driveに送信中...';
    sub.textContent = raceId + '.zip（' + assigned.length + '枚）';

    if (!GAS_UPLOAD_URL) {
      // GAS未設定：ダウンロードで代替
      await new Promise(r => setTimeout(r, 800));
      icon.textContent = '⚠️';
      msg.textContent = 'GASが未設定です';
      sub.textContent = 'ZIPをダウンロードして手動でDriveに入れてください';
      closeBtn.style.display = 'block';
      // フォールバックでダウンロード
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = raceId + '.zip';
      a.click();
      return;
    }

    const base64 = await blobToBase64(blob);

    // GASはリダイレクトが発生するためGETパラメータで送信
    // ZIPデータはチャンク分割してGETで送信
    const CHUNK = 30000;
    const chunks = [];
    for (let i = 0; i < base64.length; i += CHUNK) {
      chunks.push(base64.slice(i, i + CHUNK));
    }
    const total = chunks.length;
    sub.textContent = raceId + '.zip（' + assigned.length + '枚）送信中...';

    // セッションIDを生成
    const sessionId = Date.now() + '_' + Math.random().toString(36).slice(2,8);

    for (let ci = 0; ci < total; ci++) {
      sub.textContent = 'チャンク送信中: ' + (ci+1) + '/' + total;
      const payload = {
        action:  'chunk',
        session: sessionId,
        name:    verifiedUser,
        raceId:  raceId,
        index:   String(ci),
        total:   String(total),
        count:   String(assigned.length),
        data:    chunks[ci]
      };
      const res = await fetch(GAS_UPLOAD_URL, {
        method:  'POST',
        headers: {'Content-Type': 'application/json'},
        body:    JSON.stringify(payload)
      });
      const d = await res.json();
      if (!d.ok) throw new Error(d.error || 'チャンク送信失敗');
    }

    icon.textContent = '✅';
    msg.textContent = '送信完了！';
    sub.textContent = raceId + '.zip を送信しました';
    setTimeout(() => { ov.style.display = 'none'; }, 2200);
  } catch(e) {
    icon.textContent = '❌';
    msg.textContent = 'エラーが発生しました';
    sub.textContent = e.message;
    closeBtn.style.display = 'block';
  }
}

function blobToBase64(blob) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(',')[1]);
    r.onerror = rej;
    r.readAsDataURL(blob);
  });
}

// GASのリダイレクトに対応したGETリクエスト
function xhrGet(url) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('GET', url, true);
    xhr.onload = () => {
      try {
        resolve(JSON.parse(xhr.responseText));
      } catch(e) {
        reject(new Error('レスポンス解析失敗: ' + xhr.responseText.slice(0, 100)));
      }
    };
    xhr.onerror = () => reject(new Error('通信エラー'));
    xhr.ontimeout = () => reject(new Error('タイムアウト'));
    xhr.timeout = 30000;
    xhr.send();
  });
}

// ━━━ 振り分け ━━━
function renderUnassigned(){
  const scroll=document.getElementById('uScroll');
  const un=shots.filter(s=>!s.horseNum);
  scroll.innerHTML='';
  if(un.length===0){
    scroll.innerHTML='<span class="u-empty">未割当の写真はありません ✅</span>';
    // clearSelを呼ばずに直接処理（ループ防止）
    selectedIds.clear();
    updateSelBanner();
    return;
  }
  un.forEach((shot,idx)=>{
    const d=document.createElement('div');
    d.className='u-thumb'+(selectedIds.has(shot.id)?' sel':'');
    // サムネイル：馬番を大きく下部に表示
    d.innerHTML='<img src="'+shot.dataURL+'" style="width:100%;height:100%;object-fit:cover;object-position:center center;display:block;">'
      +'<div class="u-seq" style="position:absolute;bottom:2px;left:3px;right:3px;text-align:center;font-size:.65rem;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,1);background:rgba(0,0,0,.5);border-radius:3px;padding:1px 2px;">'+(idx+1)+'</div>'
      +'<div class="u-mark">✓</div>';
    d.addEventListener('click',()=>{
      selectedIds.has(shot.id)?selectedIds.delete(shot.id):selectedIds.add(shot.id);
      renderUnassigned();updateSelBanner();
    });
    scroll.appendChild(d);
  });
  updateSelBanner();
}
function updateSelBanner(){
  const n=selectedIds.size,b=document.getElementById('selBanner');
  document.getElementById('selCount').textContent=n;
  n>0?b.classList.add('show'):b.classList.remove('show');
}
function clearSel(){
  selectedIds.clear();
  // renderUnassignedを呼ばず直接バナーだけ更新
  document.querySelectorAll('.u-thumb').forEach(el=>el.classList.remove('sel'));
  document.querySelectorAll('.u-mark').forEach(el=>el.style.display='none');
  updateSelBanner();
}

function renderHorseGrid(){const grid=document.getElementById('horseGrid');grid.innerHTML='';for(let n=1;n<=maxHorse;n++){const photos=shots.filter(s=>s.horseNum===n);const box=document.createElement('div');box.className='horse-box'+(photos.length>0?' has-photos':'');box.innerHTML='<div class="hbox-head"><span class="hbox-num">'+n+'番</span><span class="hbox-cnt">'+photos.length+'/3枚</span>'+(photos.length>0?'<span class="hbox-clr" onclick="clearHorse('+n+')">戻す</span>':'')+'</div><div class="hbox-photos">'+(photos.length===0?'<span class="hbox-empty">タップして割当</span>':photos.map(s=>'<div class="box-photo"><img src="'+s.dataURL+'"><button class="box-del" onclick="removePhoto('+s.id+')">✕</button></div>').join(''))+'</div>';box.addEventListener('click',e=>{if(e.target.closest('.box-del')||e.target.closest('.hbox-clr'))return;assignToHorse(n);});grid.appendChild(box);}}
function assignToHorse(n){if(selectedIds.size===0)return;const cur=shots.filter(s=>s.horseNum===n).length;if(cur+selectedIds.size>3){alert(n+'番は最大3枚です（現在'+cur+'枚）');return;}selectedIds.forEach(id=>{const s=shots.find(s=>s.id===id);if(s)s.horseNum=n;});clearSel();renderUnassigned();renderHorseGrid();updateBadges();updateDlBtn();}
function removePhoto(id){const s=shots.find(s=>s.id===id);if(s)s.horseNum=null;renderUnassigned();renderHorseGrid();updateBadges();updateDlBtn();}
function clearHorse(n){shots.filter(s=>s.horseNum===n).forEach(s=>s.horseNum=null);renderUnassigned();renderHorseGrid();updateBadges();updateDlBtn();}
function updateBadges(){const t=shots.length,u=shots.filter(s=>!s.horseNum).length;const bs=document.getElementById('badge-shoot');bs.textContent=t;bs.style.display=t>0?'':'none';const bu=document.getElementById('badge-unassigned');bu.textContent=u;bu.style.display=u>0?'':'none';}
function updateDlBtn(){const n=shots.filter(s=>s.horseNum).length;const btn=document.getElementById('dlBtn');btn.disabled=n===0;btn.textContent=n>0?'📦 ZIP（'+n+'枚）':'📦 振り分け後';updateUploadBtn();}
function deleteSelected(){
  if(selectedIds.size===0){alert('削除する写真を選択してください');return;}
  if(!confirm(selectedIds.size+'枚の写真を削除しますか？'))return;
  shots=shots.filter(s=>!selectedIds.has(s.id));
  selectedIds.clear();
  renderSbThumbs();renderUnassigned();renderHorseGrid();updateBadges();updateDlBtn();
}
function clearUnassigned(){
  const un=shots.filter(s=>!s.horseNum);
  if(un.length===0){alert('未割当の写真はありません');return;}
  if(!confirm('未割当の写真 '+un.length+'枚を削除しますか？\n馬番に登録済みの写真は残ります。'))return;
  shots=shots.filter(s=>s.horseNum);
  selectedIds.clear();
  renderSbThumbs();renderUnassigned();renderHorseGrid();updateBadges();updateDlBtn();
  const sb=document.getElementById('selBanner');
  if(sb) sb.classList.remove('show');
}
function clearAll(){
  if(shots.length===0)return;
  if(!confirm('⚠️ 全'+shots.length+'枚（登録済み含む）をすべて削除しますか？\nこの操作は取り消せません。'))return;
  shots=[];nextId=1;selectedIds.clear();
  renderSbThumbs();
  renderUnassigned();
  renderHorseGrid();
  updateBadges();
  updateDlBtn();
  const sb=document.getElementById('selBanner');
  if(sb) sb.classList.remove('show');
  const ov=document.getElementById('zipOv');
  if(ov) ov.classList.remove('show');
}

// ━━━ ZIP ━━━
async function downloadZip(){const assigned=shots.filter(s=>s.horseNum);if(assigned.length===0)return;const raceId=getRaceId();const un=shots.filter(s=>!s.horseNum).length;if(un>0&&!confirm(un+'枚が未割当です。割当済みの'+assigned.length+'枚のみZIPにしますか？'))return;const ov=document.getElementById('zipOv');ov.classList.add('show');document.getElementById('zipMsg').textContent='ZIP作成中...';try{const zip=new JSZip(),folder=zip.folder(raceId),cnts={};assigned.forEach(s=>{const n=s.horseNum;cnts[n]=(cnts[n]||0)+1;folder.file('horse_'+String(n).padStart(2,'0')+'_'+cnts[n]+'.jpg',s.dataURL.split(',')[1],{base64:true});});const blob=await zip.generateAsync({type:'blob'},m=>{document.getElementById('zipSub').textContent='圧縮中: '+Math.round(m.percent)+'%';});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=raceId+'.zip';a.click();document.getElementById('zipMsg').textContent='✅ 完了！';document.getElementById('zipSub').textContent=raceId+'.zip（'+assigned.length+'枚）';setTimeout(()=>ov.classList.remove('show'),2000);}catch(e){document.getElementById('zipMsg').textContent='❌ エラー';document.getElementById('zipSub').textContent=e.message;setTimeout(()=>ov.classList.remove('show'),3000);}}

// ━━━ 初期化 ━━━
document.addEventListener('DOMContentLoaded',()=>{
  const mDate=document.getElementById('mDate');
  if(mDate) mDate.value=new Date().toISOString().slice(0,10);
  buildRaceNumGrid();
  renderHorseGrid();
  updateGoBtn();
  initUser();
  setTimeout(loadSchedule,400);
});
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!['INPUT','BUTTON','LABEL'].includes(document.activeElement.tagName)){e.preventDefault();shoot();}});
